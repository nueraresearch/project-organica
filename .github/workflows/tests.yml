name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: C6 guard tests present
        run: |
          python -c "from pathlib import Path; s = Path('tests/test_c6_timing_guard.py').read_text(encoding='utf-8'); assert 'def test_the_committed_block_passes_the_guard' in s and 'def test_the_guard_rejects_its_tamper_cases' in s, 'C6 guard tests missing'"

      - name: Engine pin
        run: python -m benchmarks.engine_pin --check

      - name: C6 block guard
        run: |
          python -m benchmarks.c6_timing_guard --self-test
          python -m benchmarks.c6_timing_guard --check

      - name: A1 readiness CI guard
        run: |
          python -m benchmarks.a1_ci_guard --check
          python -m benchmarks.a1_ci_guard --self-test

      - name: A1 gate readiness and stop conditions
        run: |
          python -m benchmarks.a1_gate_readiness --check
          python -m benchmarks.a1_gate_readiness --self-test

      - name: G9 validator CI guard
        run: |
          python -m benchmarks.g9_ci_guard --check
          python -m benchmarks.g9_ci_guard --self-test

      - name: G9 stage-ledger validator and six-class self-test
        run: |
          python -m benchmarks.g9_stage_ledger --check
          python -m benchmarks.g9_stage_ledger --self-test

      - name: Test suite
        run: python -m pytest -q
