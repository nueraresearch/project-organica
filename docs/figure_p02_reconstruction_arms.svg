<text x="108.0" y="338.0" font-size="10.5" fill="#5f5f5f" text-anchor="end" font-weight="normal">100</text>
<line x1="118.0" y1="282.0" x2="556.0" y2="282.0" stroke="#e6e6e6" stroke-width="1" stroke-linecap="round"/>
<text x="108.0" y="286.0" font-size="10.5" fill="#5f5f5f" text-anchor="end" font-weight="normal">200</text>
