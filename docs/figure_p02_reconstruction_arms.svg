<text x="737.0" y="204.0" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal">max 2 in one cycle</text>
<text x="737.0" y="408.0" font-size="11.5" fill="#5f5f5f" text-anchor="middle" font-weight="normal">default arm</text>
<rect x="828.0" y="269.0" width="62.0" height="117.0" fill="#a8a8a8" opacity="0.9"/>
<text x="859.0" y="259.0" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">3</text>
