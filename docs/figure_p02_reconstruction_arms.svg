<text x="191.0" y="355.8" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal">max 1 in one cycle</text>
<text x="191.0" y="408.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">default arm</text>
<text x="191.0" y="426.0" font-size="10" fill="#5f5f5f" text-anchor="middle" font-weight="normal">120 cycles  |  1,056 beliefs</text>
<text x="191.0" y="440.0" font-size="10" fill="#5f5f5f" text-anchor="middle" font-weight="normal">6,592 structures checked</text>
<rect x="300.0" y="309.0" width="74.0" height="77.0" fill="#c0504d" opacity="0.9"/>
<text x="337.0" y="299.0" font-size="13" fill="#c0504d" text-anchor="middle" font-weight="bold">148</text>
<text x="337.0" y="283.0" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal">max 7 in one cycle</text>
<text x="337.0" y="408.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">stress arm</text>
<text x="337.0" y="426.0" font-size="10" fill="#5f5f5f" text-anchor="middle" font-weight="normal">60 cycles  |  150 beliefs</text>
<text x="337.0" y="440.0" font-size="10" fill="#5f5f5f" text-anchor="middle" font-weight="normal">1,995 structures checked</text>
<rect x="446.0" y="384.0" width="74.0" height="2.0" fill="#c0504d" opacity="0.9"/>
<text x="483.0" y="376.0" font-size="13" fill="#5f5f5f" text-anchor="middle" font-weight="bold">0</text>
<text x="483.0" y="360.0" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal">max 0 in one cycle</text>
<text x="483.0" y="408.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">forced-tie arm</text>
<text x="483.0" y="426.0" font-size="10" fill="#5f5f5f" text-anchor="middle" font-weight="normal">60 cycles  |  298 beliefs</text>
<text x="483.0" y="440.0" font-size="10" fill="#5f5f5f" text-anchor="middle" font-weight="normal">2,266 structures checked</text>
<text x="36.0" y="474.0" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal">The cap binds in two arms on 0.16.0: the default arm loses 8 because its pool peaks at 16 against a cap of 15, and the stress arm 148 against a cap of 5.</text>
<text x="36.0" y="492.0" font-size="11.5" fill="#5f5f5f" text-anchor="start" font-weight="normal">The stress arm still carries the stronger non-vacuity argument; the forced-tie arm never lost a candidate on rank.</text>
<text x="654.0" y="122.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="bold">B. Candidates dropped (died)</text>
