<text x="483.0" y="426.0" font-size="10" fill="#5f5f5f" text-anchor="middle" font-weight="normal">60 cycles  |  692 beliefs</text>
<text x="483.0" y="440.0" font-size="10" fill="#5f5f5f" text-anchor="middle" font-weight="normal">3,988 structures checked</text>
<text x="36.0" y="474.0" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal">In the default and forced-tie arms no candidate ever lost on rank, so the selection test could not have failed there.</text>
<text x="36.0" y="492.0" font-size="11.5" fill="#5f5f5f" text-anchor="start" font-weight="normal">The stress arm carries the non-vacuity argument: the cap bound, and 403 candidates lost on it.</text>
<text x="654.0" y="122.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="bold">B. Candidates dropped (died)</text>
