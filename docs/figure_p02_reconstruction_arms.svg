<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" font-family="Helvetica,Arial,sans-serif" role="img" aria-label="The three audit-trace arms and the non-vacuity of the selection check">
<title>The three audit-trace arms and the non-vacuity of the selection check</title>
<rect width="1080" height="560" fill="#ffffff"/>
<text x="36.0" y="38.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="bold">The selection check could only fail where the contest was decided</text>
<text x="36.0" y="60.0" font-size="11.5" fill="#5f5f5f" text-anchor="start" font-weight="normal">Candidates dropped and candidates that lost on rank, per arm, with what each arm checked.</text>
<text x="36.0" y="544.0" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal">Source: docs/audit_trace_probe.json, docs/audit_trace_probe_stress.json, docs/audit_trace_probe_tie.json  |  drawn by benchmarks/figure_papers.py</text>
<text x="96.0" y="122.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="bold">A. Candidates that lost on rank</text>
