<text x="859.0" y="408.0" font-size="11.5" fill="#5f5f5f" text-anchor="middle" font-weight="normal">stress arm</text>
<rect x="950.0" y="230.0" width="62.0" height="156.0" fill="#a8a8a8" opacity="0.9"/>
<text x="981.0" y="220.0" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">4</text>
<text x="981.0" y="204.0" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal">max 2 in one cycle</text>
<text x="981.0" y="408.0" font-size="11.5" fill="#5f5f5f" text-anchor="middle" font-weight="normal">forced-tie arm</text>
<text x="36.0" y="510.0" font-size="11.5" fill="#5f5f5f" text-anchor="start" font-weight="normal">The forced-tie arm additionally made 479 stores carry a tied timestamp window, and the observer still reproduced the engine's choice.</text>
