<text x="191.0" y="360.0" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal">max 0 in one cycle</text>
<text x="191.0" y="408.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">default arm</text>
<text x="191.0" y="426.0" font-size="10" fill="#5f5f5f" text-anchor="middle" font-weight="normal">120 cycles  |  1,412 beliefs</text>
<text x="191.0" y="440.0" font-size="10" fill="#5f5f5f" text-anchor="middle" font-weight="normal">8,061 structures checked</text>
<rect x="300.0" y="176.4" width="74.0" height="209.6" fill="#c0504d" opacity="0.9"/>
<text x="337.0" y="166.4" font-size="13" fill="#c0504d" text-anchor="middle" font-weight="bold">403</text>
<text x="337.0" y="150.4" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal">max 7 in one cycle</text>
<text x="337.0" y="408.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">stress arm</text>
<text x="337.0" y="426.0" font-size="10" fill="#5f5f5f" text-anchor="middle" font-weight="normal">60 cycles  |  290 beliefs</text>
<text x="337.0" y="440.0" font-size="10" fill="#5f5f5f" text-anchor="middle" font-weight="normal">3,240 structures checked</text>
<rect x="446.0" y="384.0" width="74.0" height="2.0" fill="#c0504d" opacity="0.9"/>
<text x="483.0" y="376.0" font-size="13" fill="#5f5f5f" text-anchor="middle" font-weight="bold">0</text>
